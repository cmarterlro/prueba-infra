name: Deploy Infra with Terraform

on:
  push:
    branches:
      - pre

jobs:
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Plan
        run: terraform plan -out=tfplan.binary
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Validar plan (solo si hay cambios)
        run: |
          terraform show -json tfplan.binary > tfplan.json
          if jq -e '.resource_changes | length == 0' tfplan.json > /dev/null; then
            echo "✅ No hay cambios en el plan. Cancelando ejecución."
            exit 0
          else
            echo "⚠️ Se detectaron cambios en el plan. Continuando con apply..."
          fi

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan.binary
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
