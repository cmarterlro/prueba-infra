name: Deploy Infra with Terraform

on:
  push:
    branches:
      - pre

jobs:
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Validar plan (solo si hay cambios)
        run: |
          terraform show -json tfplan > tfplan.json || { echo "❌ Error al convertir tfplan a JSON"; exit 1; }
          CHANGES=$(jq '.resource_changes | length' tfplan.json 2>/dev/null || echo "parse_error")
          if [ "$CHANGES" = "parse_error" ]; then
            echo "❌ Error al analizar tfplan.json con jq"
            exit 1
          elif [ "$CHANGES" -eq "0" ]; then
            echo "✅ No hay cambios en el plan. Cancelando ejecución."
            exit 0
          else
            echo "⚠️ Se detectaron $CHANGES cambios en el plan. Continuando con apply..."
          fi

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
